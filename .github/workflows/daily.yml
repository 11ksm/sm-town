name: KR Stock Radar - Daily Update

on:
  schedule:
    - cron: "30 22 * * 0-4"   # UTC 22:30 = KST 07:30, 한국 평일(월~금)
    - cron: "15 23 * * 0-4"   # UTC 23:15 = KST 08:15, 첫 예약이 건너뛰어졌을 때 대비
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: true   # 실행 중 새로 시작되면 이전 실행은 취소 (충돌 방지)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python run_pipeline.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 생성된 결과물을 임시 보관
          mkdir -p /tmp/out && cp -r docs/. /tmp/out/

          # 원격 최신 상태로 맞춘 뒤, 이번 실행 결과로 docs/ 를 통째로 덮어쓰기
          git fetch origin main
          git reset --hard origin/main
          rm -rf docs && mkdir docs && cp -r /tmp/out/. docs/

          git add docs/
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: daily update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main
